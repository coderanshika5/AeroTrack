services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aerotrack
      POSTGRES_PASSWORD: aerotrack
      POSTGRES_DB: aerotrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotrack"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data:
